<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEZZ -- Skybox . A-Frame</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=block" rel="stylesheet">
<script src="a-frame.min.js"></script>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; }
body { font-family: 'JetBrains Mono', monospace; }
a-scene { width: 100% !important; height: 100% !important; }
a-scene .a-enter-vr, a-scene .a-enter-ar { display: none !important; }
body.ocean a-scene .a-enter-vr { display: inline-block !important; }
#hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 14px 18px;
  pointer-events: none;
  font-size: .62rem; letter-spacing: .18em; text-transform: uppercase;
  color: #7c94c9;
}
#hud .t { color: #d9f4ff; letter-spacing: .22em; }
#hud a {
  pointer-events: auto;
  color: #d9f4ff; text-decoration: none;
  border: 1px solid #3a4a72;
  background: rgba(7, 11, 28, 0.6);
  padding: 9px 13px;
  transition: color .2s, border-color .2s, background .2s;
}
#hud a:hover { color: #ffed00; border-color: #ff00a8; background: rgba(255, 0, 168, 0.15); }
#gate {
  position: fixed; inset: 0; z-index: 15;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: rgba(7, 11, 28, 0.55);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  cursor: pointer;
  text-transform: uppercase; letter-spacing: .18em;
  color: #d9f4ff; text-align: center;
}
#gate .k {
  border: 1px dashed #00f0ff;
  color: #00f0ff;
  padding: 16px 22px;
  font-size: .78rem;
}
#gate small { color: #7c94c9; font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; }
#hint {
  position: fixed; bottom: 16px; left: 0; right: 0; z-index: 20;
  text-align: center;
  font-size: .6rem; letter-spacing: .18em; text-transform: uppercase;
  color: #7c94c9; pointer-events: none;
}
#pos {
  position: fixed; bottom: 44px; left: 18px; z-index: 20;
  font-size: .56rem; letter-spacing: .12em; text-transform: uppercase;
  color: #7c94c9; pointer-events: none;
}
#dbg { display: none; position: fixed; right: 18px; top: 54px; z-index: 30; font-family: 'JetBrains Mono', monospace; }
#dbgToggle { background: rgba(7, 11, 28, 0.7); border: 1px solid #00f0ff; color: #00f0ff; padding: 8px 12px; font-size: .62rem; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; }
#dbgToggle:hover { background: #00f0ff; color: #000b14; }
#dbgPanel { display: none; margin-top: 8px; background: rgba(7, 11, 28, 0.85); border: 1px solid #3a4a72; padding: 12px 14px; width: 230px; }
#dbg.open #dbgPanel { display: block; }
#dbgPanel .dbg-title { color: #d9f4ff; font-size: .6rem; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 10px; }
#dbgPanel label { display: flex; flex-direction: column; gap: 4px; color: #7c94c9; font-size: .56rem; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 10px; }
#dbgPanel label span { display: flex; justify-content: space-between; align-items: baseline; }
.dbg-val { color: #00f0ff; font-weight: 400; letter-spacing: .08em; }
#dbgPanel input[type=range] { width: 100%; accent-color: #00f0ff; }
#dbgStatus { font-size: .54rem; color: #00ff41; letter-spacing: .1em; margin-top: 6px; }
.p-only, .o-only { display: none; }
#err { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #2a0a12; color: #ff5c8a; font-size: .7rem; letter-spacing: .08em; padding: 10px 14px; }
#err.show { display: block; }
body.off #gate { display: none; }
</style>
</head>
<body class="off">
<a-scene renderer="antialias: false">
  <a-entity id="sky" tezz-sky="kind: nebula"></a-entity>
  <a-entity id="ocean" tezz-ocean visible="false"></a-entity>
  <a-entity id="player" camera position="0 1.6 0" look-controls="pointerLockEnabled: true" fly-wasd="speed: 20; fly: true"></a-entity>
</a-scene>
<div id="hud">
  <span class="t" id="hudTitle">VOID WALKER</span>
  <a href="shaders.html#s7" id="back">&#8592; BACK TO LAB</a>
</div>
<div id="gate" role="button" tabindex="0" aria-label="Enter the skybox">
  <span class="k">&#9654; CLICK TO FLY -- WASD MOVE . MOUSE LOOK . ESC RELEASE</span>
  <small>equirectangular skybox . A-Frame</small>
</div>
<div id="hint">WASD move . mouse look . Esc release</div>
<div id="pos"></div>
<div id="dbg">
  <button id="dbgToggle" type="button">&#9776; DEBUG</button>
  <div id="dbgPanel">
    <div class="dbg-title" id="dbgTitle">Textures</div>
    <label><span>Normal strength <b class="dbg-val" id="vNormal"></b></span><input type="range" id="dbgNormal" min="0" max="2" step="0.05" value="0.9"></label>
    <label><span>Spec intensity <b class="dbg-val" id="vSpec"></b></span><input type="range" id="dbgSpec" min="0" max="1.5" step="0.05" value="0.9"></label>
    <label class="p-only"><span>Spec shine <b class="dbg-val" id="vShine"></b></span><input type="range" id="dbgShine" min="10" max="400" step="10" value="220"></label>
    <label><span>Reflection (fresnel) <b class="dbg-val" id="vFres"></b></span><input type="range" id="dbgFres" min="0" max="2" step="0.05" value="1"></label>
    <label class="o-only"><span>Foam amount <b class="dbg-val" id="vFoam"></b></span><input type="range" id="dbgFoam" min="0" max="2" step="0.05" value="0.9"></label>
    <label class="o-only"><span>Fog density <b class="dbg-val" id="vFog"></b></span><input type="range" id="dbgFog" min="0" max="0.01" step="0.0005" value="0.004"></label>
    <label><span>Texture scale <b class="dbg-val" id="vScale"></b></span><input type="range" id="dbgScale" min="0.5" max="4" step="0.1" value="1"></label>
    <div id="dbgStatus"></div>
  </div>
</div>
<div id="err"></div>
<script>
(function () {
  'use strict';

  const params = new URLSearchParams(location.search);
  const kParam = params.get('kind');
  const kind = (kParam === 'planet' || kParam === 'ocean') ? kParam : 'nebula';
  const titleEl = document.getElementById('hudTitle');
  const backEl = document.getElementById('back');
  const gate = document.getElementById('gate');
  const errEl = document.getElementById('err');
  const skyEl = document.getElementById('sky');
  const playerEl = document.getElementById('player');
  const scene = document.querySelector('a-scene');

  titleEl.textContent = kind === 'planet' ? 'ORBITAL DRIFT' : 'VOID WALKER';
  backEl.setAttribute('href', 'shaders.html#' + (kind === 'planet' ? 's8' : 's7'));

  function fail(msg) { errEl.textContent = msg; errEl.classList.add('show'); }
  if (!window.AFRAME) { fail('A-Frame failed to load.'); return; }

  /* ============================================================
     GLSL SKYBOX CORES -- raymarched, driven by camera position so
     WASD movement produces real parallax. Same sources as shaders.html.
     ============================================================ */
  const SKY_NOISE = `
float hash31(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash31(i+vec3(0,0,0)),hash31(i+vec3(1,0,0)),f.x),
                 mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),
                mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y),f.z); }
float noise2(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash21(i), hash21(i+vec2(1,0)), u.x), mix(hash21(i+vec2(0,1)), hash21(i+vec2(1,1)), u.x), u.y); }
float fbm3(vec3 p){ float v=0.0,a=.5; for(int i=0;i<4;i++){ v+=a*noise3(p); p=p*2.03+vec3(17.7,3.3,9.1); a*=.5; } return v; }
float fbm2(vec2 p){ float v=0.0,a=.5; for(int i=0;i<5;i++){ v+=a*noise2(p); p=p*2.02+vec2(7.7,3.3); a*=.5; } return v; }
`;

  const NEBULA_CORE = SKY_NOISE + `
float wisp(vec3 p, float tm){ float f=fbm3(p); return fbm3(p + f*2.2 + vec3(0.0, tm*0.02, 0.0)); }
vec3 skyCore(vec3 ro, vec3 rd, float t){
  vec3 col=vec3(0.0);
  vec3 sp=rd*160.0;
  for(int i=0;i<2;i++){
    vec3 id=floor(sp);
    vec3 fr=fract(sp)-0.5;
    float h=hash31(id);
    col+=vec3(0.85,0.9,1.0)*step(0.97,h)*pow(max(0.0,1.0-length(fr)*4.0),3.0)*1.2;
    sp*=1.6;
  }
  for(int i=0;i<30;i++){
    float d=float(i)/30.0;
    float tt=2.0+d*d*46.0;
    vec3 pos=ro+rd*tt;
    float dens=wisp(pos*0.4, t);
    dens=max(0.0,dens-0.42);
    vec3 tint=mix(vec3(0.35,0.5,1.0), vec3(1.0,0.3,0.7), noise3(pos*0.6));
    col+=tint*dens*(1.0-d*0.55)*0.5;
  }
  col=1.0-exp(-col*1.2);
  return col;
}`;

  /* S8 -- ORBITAL DRIFT: raymarched terrain on a planet surface.
     Perf: 3-octave fbm, 48 steps, cheaper step growth, normal lighting
     only near the camera, softer sun disc (approx 3-4x faster). */
  /* Quality tiers: the raymarch step count + distance are compile-time
     constants in GLSL ES 1.0, so we choose them ONCE before building the
     shader. Phones / weak integrated GPUs get a much cheaper march and a
     lower render resolution; discrete-GPU desktops get the full-fat build. */
  function detectQuality() {
    const table = {
      low: { steps: 32, dist: 260, detail: 80, res: 0.5, label: 'LOW' },
      med: { steps: 48, dist: 350, detail: 110, res: 0.6, label: 'MED' },
      high: { steps: 80, dist: 500, detail: 160, res: 0.7, label: 'HIGH' }
    };
    const forced = (location.search.match(/[?&]q=(\w+)/) || [])[1];
    if (forced && table[forced]) return table[forced];
    const mobile = /Android|iPhone|iPad|iPod|Mobi|Tablet/i.test(navigator.userAgent);
    const cores = navigator.hardwareConcurrency || 8;
    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (mobile || coarse || cores <= 4) return table.low;
    if (cores <= 8) return table.med;
    return table.high;
  }
  const QUALITY = detectQuality();

  const PLANET_CORE = SKY_NOISE + `
float fbm2c(vec2 p){ float v=0.0,a=.5; for(int i=0;i<3;i++){ v+=a*noise2(p); p=p*2.1+vec2(7.7,3.3); a*=.5; } return v; }
/* Cheap march surface: main relief only (3 octaves), so every march step costs
   3 noise samples instead of 6. The fine octave layer is applied only at the
   final hit for shading -- this is what makes it run on a potato. */
float terrainM(vec2 p){ return fbm2c(p*0.05)*14.0-6.0; }
float terrain(vec2 p){
  float h=fbm2c(p*0.05);
  h+=fbm2c(p*0.18+vec2(3.7,1.2))*0.45;
  return h*14.0-6.0;
}

uniform float uHasTex;
uniform float uTexScale;
uniform float uNormalStr;
uniform float uSpecInt;
uniform float uSpecShine;
uniform float uFresnelStr;
uniform sampler2D uRockA;
uniform sampler2D uRockN;
uniform sampler2D uGrassA;
uniform sampler2D uGrassN;
uniform sampler2D uRockR;
uniform sampler2D uGrassR;

vec3 skyCore(vec3 ro, vec3 rd, float t){
  vec3 sun=normalize(vec3(0.55,0.45,0.35));
  vec3 col;
  bool hit=false;
  float tPrev=0.0, tHit=${QUALITY.dist}.0;
  /* Upward rays from above all terrain skip the march. */
  if(rd.y<0.0 || ro.y<6.8){
    for(int i=1;i<${QUALITY.steps};i++){
      float tt=${QUALITY.dist}.0*pow(float(i)/${QUALITY.steps}.0, 1.5);
      vec3 pp=ro+rd*tt;
      if(pp.y<terrainM(pp.xz)){ hit=true; tHit=tt; break; }
      tPrev=tt;
    }
  }
  if(hit){
    /* bisection on the cheap surface (5 iters) */
    for(int j=0;j<5;j++){
      float tm=0.5*(tPrev+tHit);
      vec3 pm=ro+rd*tm;
      if(pm.y < terrainM(pm.xz)){ tHit=tm; } else { tPrev=tm; }
    }
    float tt=0.5*(tPrev+tHit);
    vec3 p=ro+rd*tt;
    float h=terrain(p.xz);
    /* Snow line follows the SMOOTH main relief, not the fine detail -- a
       fine-detailed snow boundary shimmers as you strafe. */
    float snowMask=smoothstep(3.8,5.6,terrainM(p.xz));
    vec3 rockBase=mix(vec3(0.32,0.22,0.14), vec3(0.55,0.45,0.32), smoothstep(1.0,4.5,h));
    vec3 snow=vec3(0.92,0.94,1.0);
    vec3 tc=mix(rockBase, snow, snowMask);
    vec3 n=vec3(0.0,1.0,0.0);
    float rough=0.85;
    /* Normals + textures only within ${QUALITY.detail} units -- beyond that fog hides it. */
    if(tt<${QUALITY.detail}.0){
      float e=1.8;
      n=normalize(vec3(terrain(p.xz+vec2(e,0.0))-terrain(p.xz-vec2(e,0.0)), 2.0*e, terrain(p.xz+vec2(0.0,e))-terrain(p.xz-vec2(0.0,e))));
      float slope=1.0-clamp(n.y,0.0,1.0);
      if(uHasTex>0.5){
        vec2 uv=p.xz*uTexScale;
        vec3 rA=texture2D(uRockA, uv).xyz;
        vec3 gA=texture2D(uGrassA, uv).xyz;
        vec3 rN=texture2D(uRockN, uv).xyz*2.0-1.0;
        vec3 gN=texture2D(uGrassN, uv).xyz*2.0-1.0;
        float rR=texture2D(uRockR, uv).r;
        float gR=texture2D(uGrassR, uv).r;
        float veg=fbm2(p.xz*0.05+vec2(1.7,3.3))*fbm2(p.xz*0.02+vec2(8.2,1.1));
        float vegMask=smoothstep(0.35,0.62,veg)*(1.0-smoothstep(2.0,3.8,h))*(1.0-smoothstep(0.45,0.25,slope));
        vec3 albedo=mix(rA, gA, vegMask);
        vec3 nrm=normalize(mix(rN, gN, vegMask));
        rough=mix(rR, gR, vegMask);
        tc=mix(tc, albedo, 0.85);
        /* less rock normal detail on snow -- otherwise the rock bumps
           shimmer under the flat white coat */
        n=normalize(mix(n, nrm, uNormalStr*(1.0-snowMask)));
      }
    }
    /* snow is matte -- prevents glint shimmer on the white caps */
    rough=mix(rough, 0.92, snowMask);
    /* ---- World light ---- */
    vec3 sunCol=vec3(1.0,0.88,0.66);
    /* Safe view/reflection vectors: a near-zero length (camera flush with the
       ground) would otherwise NaN and flash black polygons. */
    vec3 V=ro-p;
    float vlen=length(V);
    V=(vlen<0.001)? vec3(0.0,0.0,-1.0) : V/vlen;
    vec3 H=sun+V;
    float hlen=length(H);
    H=(hlen<0.001)? vec3(0.0,0.0,1.0) : H/hlen;
    float ndv=max(dot(n,V),0.0);
    float ndh=max(dot(n,H),0.0);
    float diff=max(dot(n,sun),0.0);
    float smoothness=1.0-clamp(rough,0.0,1.0);
    vec3 amb=mix(vec3(0.16,0.2,0.3), vec3(0.45,0.5,0.65), clamp(n.y*0.5+0.5,0.0,1.0))*0.45;
    float flatMix=smoothstep(60.0, 150.0, tt);
    vec3 light=(amb+sunCol*diff)*(1.0-flatMix)+(amb+vec3(0.5,0.48,0.45))*flatMix;
    tc*=light;
    float F=0.04+0.96*pow(1.0-ndv,5.0);
    float spec=pow(max(ndh,0.0), mix(2.0, uSpecShine, smoothness))*smoothness*F;
    tc+=sunCol*spec*(1.0-flatMix)*uSpecInt*uFresnelStr;
    float fog=1.0-exp(-tt*0.005);
    tc=mix(tc, vec3(0.38,0.47,0.58), fog);
    col=tc;
  } else {
    col=mix(vec3(0.32,0.42,0.55), vec3(0.05,0.09,0.16), clamp(rd.y,0.0,1.0));
  }
  float sd=dot(rd,sun);
  col+=vec3(1.0,0.85,0.55)*pow(max(sd,0.0),400.0)*2.0;
  col+=vec3(1.0,0.6,0.3)*pow(max(sd,0.0),6.0)*0.35;
  col=mix(col, vec3(0.8,0.6,0.4)*0.5, pow(1.0-abs(rd.y),2.0)*0.3);
  col=1.0-exp(-col*1.15);
  if (col.x != col.x) col = vec3(0.55, 0.4, 0.3);
  return col;
}`;

  /* Blue-sky cumulus core -- pronounced puffy clouds on a perspective sky. */
  const CLOUDS_CORE = SKY_NOISE + `
vec3 skyCore(vec3 ro, vec3 rd, float t){
  float y=rd.y;
  vec3 top=vec3(0.20,0.44,0.90);
  vec3 mid=vec3(0.55,0.74,0.97);
  vec3 hor=vec3(0.85,0.93,1.00);
  vec3 col=mix(mix(hor, mid, smoothstep(-0.6,0.2,y)), top, smoothstep(0.2,0.85,y));
  vec3 sun=normalize(vec3(0.62,0.42,0.35));
  float sd=dot(rd,sun);
  col+=vec3(1.0,0.95,0.8)*pow(max(sd,0.0),1400.0)*1.8;
  col+=vec3(1.0,0.9,0.7)*pow(max(sd,0.0),6.0)*0.22;
  vec2 p=vec2(atan(rd.z,rd.x)/6.28318, asin(clamp(y,-1.0,1.0))/3.14159+0.5);
  p*=vec2(2.2,1.7);
  float t2=t*0.014;
  float c=fbm2(p*1.9+vec2(t2,0.0));
  float c2=fbm2(p*2.6+vec2(4.1,9.2)+c*2.2-vec2(t2*0.6,0.0));
  float cloud=clamp((c2-0.40)*3.2,0.0,1.0);
  cloud=pow(cloud,1.35);
  cloud*=smoothstep(1.05,0.25,abs(y-0.06)*1.15);
  cloud*=smoothstep(-0.6,0.0,y);
  float lit=0.35+0.65*smoothstep(0.25,0.8,c2);
  vec3 cloudCol=mix(vec3(0.5,0.58,0.72), vec3(1.0,1.0,0.99), lit);
  col=mix(col, cloudCol, cloud*0.95);
  return col;
}`;

  /* three.js-style wave plane -- the vertex shader displaces the mesh,
     the fragment adds sun glitter, foam and distance haze. */
  const OCEAN_VERT = `
uniform float uTime;
varying vec3 vWorld;
varying vec3 vNormal;
varying float vWave;
varying vec2 vUv;
vec3 gerstner(vec2 pos, inout vec3 tan, inout vec3 bin, float steepness, float wavelength, vec2 dir, float t){
  float k=6.28318/wavelength;
  float c=sqrt(9.8/k);
  vec2 d=normalize(dir);
  float f=k*(dot(d,pos)-c*t);
  float a=steepness/k;
  tan+=vec3(-d.x*d.x*steepness*sin(f), d.x*steepness*cos(f), -d.x*d.y*steepness*sin(f));
  bin+=vec3(-d.x*d.y*steepness*sin(f), d.y*steepness*cos(f), -d.y*d.y*steepness*sin(f));
  return vec3(d.x*a*cos(f), a*sin(f), d.y*a*cos(f));
}
void main(){
  vWorld=(modelMatrix*vec4(position,1.0)).xyz;
  vUv=vWorld.xz/300.0;
  vec3 pos=vWorld;
  vec3 tan=vec3(1.0,0.0,0.0);
  vec3 bin=vec3(0.0,0.0,1.0);
  pos+=gerstner(vWorld.xz, tan, bin, 0.22, 60.0, vec2(1.0,0.3), uTime);
  pos+=gerstner(vWorld.xz, tan, bin, 0.16, 30.0, vec2(0.7,1.0), uTime);
  pos+=gerstner(vWorld.xz, tan, bin, 0.11, 16.0, vec2(0.4,0.6), uTime);
  pos+=gerstner(vWorld.xz, tan, bin, 0.07, 10.0, vec2(1.0,0.8), uTime);
  vNormal=normalize(cross(bin,tan));
  vWave=pos.y;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(pos,1.0);
}`;

  const OCEAN_FRAG = `
precision highp float;
uniform vec3 uCamPos;
uniform float uTime;
uniform float uHasTex;
uniform float uTexScale;
uniform float uNormalStr;
uniform float uSpecInt;
uniform float uFresnelStr;
uniform float uFoamAmt;
uniform float uFogDensity;
uniform sampler2D uWaterNorm;
uniform sampler2D uFoamTex;
varying vec3 vWorld;
varying vec3 vNormal;
varying float vWave;
varying vec2 vUv;
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise2(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash21(i), hash21(i+vec2(1,0)), u.x), mix(hash21(i+vec2(0,1)), hash21(i+vec2(1,1)), u.x), u.y); }
float fbm2(vec2 p){ float v=0.0,a=.5; for(int i=0;i<4;i++){ v+=a*noise2(p); p=p*2.1+vec2(7.7,3.3); a*=.5; } return v; }
vec3 perturbN(){
  vec3 n=normalize(vNormal);
  /* procedural macro detail */
  vec2 q=vUv*uTexScale*8.0+vec2(uTime*0.05,0.0);
  float e=0.02;
  float d1=fbm2(q), d2=fbm2(q+vec2(e,0.0)), d3=fbm2(q+vec2(0.0,e));
  n=normalize(n+vec3((d2-d1)*8.0, 0.0, (d3-d1)*8.0));
  if(uHasTex>0.5){
    /* texture bombing: three samples at very different scales, each scrolling
       its own direction, blend into one non-repeating normal field */
    vec2 s1=vec2(uTime*0.03, uTime*0.02);
    vec2 s2=vec2(-uTime*0.05, uTime*0.04)+vec2(3.1,7.7);
    vec2 s3=vec2(uTime*0.02, -uTime*0.07)+vec2(9.3,4.1);
    vec3 n1=texture2D(uWaterNorm, fract(vUv*uTexScale*5.0  + s1)).xyz*2.0-1.0;
    vec3 n2=texture2D(uWaterNorm, fract(vUv*uTexScale*13.0 + s2)).xyz*2.0-1.0;
    vec3 n3=texture2D(uWaterNorm, fract(vUv*uTexScale*31.0 + s3)).xyz*2.0-1.0;
    vec3 bomb=normalize(n1*0.55 + n2*0.85 + n3*1.25);
    /* distance fade: fine detail drops out far away so it cannot moire */
    float dist=distance(vWorld.xz, uCamPos.xz);
    float fade=clamp(1.0 - dist/700.0, 0.15, 1.0);
    n=normalize(mix(n, normalize(vNormal+bomb*0.8), uNormalStr*fade));
  }
  return n;
}
void main(){
  vec3 sun=normalize(vec3(0.6,0.45,0.35));
  vec3 V=normalize(uCamPos-vWorld);
  vec3 N=perturbN();
  float ndv=max(dot(N,V),0.0);
  /* fresnel -- water reflects the sky strongly at grazing angles */
  float F=0.02+0.98*pow(1.0-ndv,5.0);
  /* water body: deep to shallow */
  vec3 deep=vec3(0.004,0.10,0.20);
  vec3 shallow=vec3(0.10,0.45,0.50);
  vec3 baseCol=mix(deep, shallow, clamp(0.5+vWave*0.4,0.0,1.0));
  /* sky reflection through fresnel */
  vec3 skyCol=mix(vec3(0.75,0.86,0.97), vec3(0.22,0.45,0.90), clamp(N.y,0.0,1.0));
  vec3 col=mix(baseCol, skyCol, clamp(F*0.9*uFresnelStr, 0.0, 1.0));
  /* sun reflections: sharp specular disc + broad glitter path */
  vec3 H=normalize(sun+V);
  float ndh=max(dot(N,H),0.0);
  col+=vec3(1.0,0.95,0.82)*pow(ndh,384.0)*2.4*uSpecInt;
  col+=vec3(1.0,0.92,0.72)*pow(ndh,26.0)*0.45*uSpecInt;
  /* foam: two layered foam-texture samples at different scales/directions
     so the foam pattern does not visibly repeat */
  float foam=clamp((vWave-0.9)*2.2,0.0,1.0);
  float foamN=0.5;
  if(uHasTex>0.5){
    float f1=texture2D(uFoamTex, fract(vUv*uTexScale*28.0+vec2(uTime*0.09,-uTime*0.06))).a;
    float f2=texture2D(uFoamTex, fract(vUv*uTexScale*87.0-vec2(uTime*0.05,uTime*0.08)+vec2(4.7,2.3))).a;
    foamN=0.45*f1+0.55*f2;
  } else {
    foamN=0.45+0.55*fbm2(vUv*uTexScale*80.0+vec2(uTime*0.09,0.0));
  }
  foam*=foamN;
  col=mix(col, vec3(0.96,0.98,1.0), foam*uFoamAmt);
  /* distance fog -- fades the horizon into atmospheric haze */
  float dist=distance(vWorld.xz,uCamPos.xz);
  float fog=1.0-exp(-dist*uFogDensity);
  col=mix(col, vec3(0.70,0.83,0.93), fog*0.85);
  gl_FragColor=vec4(col,1.0);
}`;

  const SKY_VERT = `
varying vec3 vPos;
void main(){
  vPos = (modelMatrix * vec4(position, 1.0)).xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;

  function skySphereFrag(core) {
    return 'precision highp float;\nuniform float uTime;\nuniform vec3 uCamPos;\nvarying vec3 vPos;\n'
      + core
      + '\nvoid main(){ vec3 rd=normalize(vPos-uCamPos); vec3 col=skyCore(uCamPos, rd, uTime); gl_FragColor=vec4(col,1.0); }';
  }
  AFRAME.registerComponent('tezz-sky', {
    schema: { kind: { default: 'nebula' } },
    init: function () {
      const geo = new THREE.SphereGeometry(3000, 192, 96);
      const white = new THREE.DataTexture(new Uint8Array([255, 255, 255]), 1, 1);
      white.needsUpdate = true;
      const flat = new THREE.DataTexture(new Uint8Array([128, 128, 255]), 1, 1);
      flat.needsUpdate = true;
      const uniforms = {
        uTime: { value: 0 },
        uCamPos: { value: new THREE.Vector3(0, 1.6, 0) },
        uHasTex: { value: 0 },
        uTexScale: { value: 0.02 },
        uNormalStr: { value: 0.9 },
        uSpecInt: { value: 0.5 },
        uSpecShine: { value: 220 },
        uFresnelStr: { value: 1 },
        uRockA: { value: white }, uRockN: { value: flat },
        uGrassA: { value: white }, uGrassN: { value: flat },
        uRockR: { value: white }, uGrassR: { value: white }
      };
      const mat = new THREE.ShaderMaterial({
        uniforms: uniforms,
        vertexShader: SKY_VERT,
        fragmentShader: skySphereFrag(this.data.kind === 'planet' ? PLANET_CORE : this.data.kind === 'clouds' ? CLOUDS_CORE : NEBULA_CORE),
        side: THREE.BackSide,
        depthWrite: false
      });
      if (this.data.kind === 'planet') this.loadPlanetTextures(mat);
      this.mesh = new THREE.Mesh(geo, mat);
      this.mesh.frustumCulled = false;
      this.el.object3D.add(this.mesh);
    },
    loadPlanetTextures: function (mat) {
      const loader = new THREE.TextureLoader();
      loader.setCrossOrigin('');
      const map = {
        uRockA: 'Assets/planet-rock-albedo.jpg',
        uRockN: 'Assets/planet-rock-normal.jpg',
        uRockR: 'Assets/planet-rock-rough.jpg',
        uGrassA: 'Assets/planet-grass-albedo.jpg',
        uGrassN: 'Assets/planet-grass-normal.jpg',
        uGrassR: 'Assets/planet-grass-rough.jpg'
      };
      const keys = Object.keys(map);
      let done = 0;
      const onLoad = function () { if (++done >= keys.length) mat.uniforms.uHasTex.value = 1; };
      keys.forEach(k => {
        loader.load(map[k], tex => {
          tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
          tex.anisotropy = 8;
          mat.uniforms[k].value = tex;
          onLoad();
        }, undefined, onLoad);
      });
    },
    tick: function (t) {
      const u = this.mesh.material.uniforms;
      u.uTime.value = t * 0.001;
      /* Feed the camera position straight from the player entity so WASD
         movement genuinely re-rays the scene (real parallax). */
      const player = document.getElementById('player');
      if (player && player.object3D) {
        const p = player.object3D.position;
        u.uCamPos.value.set(p.x, p.y, p.z);
      }
    }
  });

  /* Generates a seamless foam texture procedurally (fbm + domain warp) --
     avoids depending on any external foam image. */
  function makeFoamTexture() {
    const size = 256;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(size, size);
    const data = img.data;
    const rnd = function (a, b) { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
    const noise = function (x, y) {
      const W = size, H = size;
      const gx = ((x % W) + W) % W, gy = ((y % H) + H) % H;
      const ix = Math.floor(gx) % W, iy = Math.floor(gy) % H;
      const fx = gx - Math.floor(gx), fy = gy - Math.floor(gy);
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const a = rnd(ix, iy), b = rnd((ix + 1) % W, iy), cc = rnd(ix, (iy + 1) % H), d = rnd((ix + 1) % W, (iy + 1) % H);
      return a + (b - a) * u + (cc - a) * v + (a - b - cc + d) * u * v;
    };
    const fbm = function (x, y) {
      let v = 0, a = 1;
      for (let o = 0; o < 4; o++) { v += a * noise(x, y); x *= 2.03; y *= 2.03; a *= 0.5; }
      return v;
    };
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const sx = (x / size) * 6, sy = (y / size) * 6;
        let v = fbm(sx, sy);
        v = fbm(sx + v * 2.0, sy + v * 2.0);
        const t = Math.max(0, Math.min(1, (v - 0.5) * 3.0));
        const g = t * t * (3 - 2 * t);
        const idx = (y * size + x) * 4;
        data[idx] = 255; data[idx + 1] = 255; data[idx + 2] = 255; data[idx + 3] = Math.round(g * 255);
      }
    }
    ctx.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  AFRAME.registerComponent('tezz-ocean', {
    init: function () {
      const geo = new THREE.PlaneGeometry(3000, 3000, 384, 384);
      geo.rotateX(-Math.PI / 2);
      const dummy = new THREE.DataTexture(new Uint8Array([128, 128, 255]), 1, 1);
      dummy.needsUpdate = true;
      const foamTex = makeFoamTexture();
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uCamPos: { value: new THREE.Vector3(0, 4.5, 0) },
          uHasTex: { value: 0 },
          uTexScale: { value: 1 },
          uNormalStr: { value: 0.9 },
          uSpecInt: { value: 0.9 },
          uFresnelStr: { value: 1 },
          uFoamAmt: { value: 0.9 },
          uFogDensity: { value: 0.004 },
          uWaterNorm: { value: dummy },
          uFoamTex: { value: foamTex }
        },
        vertexShader: OCEAN_VERT,
        fragmentShader: OCEAN_FRAG,
        side: THREE.DoubleSide
      });
      /* Wave normal map -- the 'wave texture'. setCrossOrigin('') keeps it
         loading over file://. */
      const loader = new THREE.TextureLoader();
      loader.setCrossOrigin('');
      let waterReady = false;
      loader.load('Assets/water-normals.jpg', function (tex) {
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.anisotropy = 8;
        mat.uniforms.uWaterNorm.value = tex;
        waterReady = true;
        mat.uniforms.uHasTex.value = 1;
      }, undefined, function () { waterReady = true; mat.uniforms.uHasTex.value = 1; });
      this.mesh = new THREE.Mesh(geo, mat);
      this.mesh.frustumCulled = false;
      this.el.object3D.add(this.mesh);
    },
    tick: function (t) {
      const u = this.mesh.material.uniforms;
      u.uTime.value = t * 0.001;
      const c = this.el.sceneEl.camera;
      if (c) u.uCamPos.value.set(c.position.x, 0, c.position.z);
    }
  });

  /* Self-contained fly/walk controller. A-Frame's built-in wasd-controls
     proved unreliable (never registered keys), so this drives the camera
     entity directly: WASD moves along the look direction, fly=true lets
     W/S follow pitch (up/down). */
  AFRAME.registerComponent('fly-wasd', {
    schema: { speed: { default: 20 }, fly: { default: true } },
    init: function () {
      this.keys = {};
      this.onKeyDown = e => { if (['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code) !== -1) this.keys[e.code] = true; };
      this.onKeyUp = e => { this.keys[e.code] = false; };
      window.addEventListener('keydown', this.onKeyDown);
      window.addEventListener('keyup', this.onKeyUp);
    },
    tick: function (t, dt) {
      const k = this.keys;
      const fwdFlag = k.KeyW || k.ArrowUp, backFlag = k.KeyS || k.ArrowDown;
      const leftFlag = k.KeyA || k.ArrowLeft, rightFlag = k.KeyD || k.ArrowRight;
      if (!fwdFlag && !backFlag && !leftFlag && !rightFlag) return;
      const cam = this.el.object3D;
      const s = this.data.speed * dt / 1000;
      /* IMPORTANT: read the direction from the actual camera object. The
         entity group's getWorldDirection() returns +Z, but the camera
         renders along -Z -- using the group would invert every movement. */
      const dirObj = (this.el.components.camera && this.el.components.camera.camera) || cam;
      const fwd = new THREE.Vector3();
      dirObj.getWorldDirection(fwd);
      const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
      const move = new THREE.Vector3();
      if (fwdFlag) move.add(fwd);
      if (backFlag) move.sub(fwd);
      if (leftFlag) move.sub(right);
      if (rightFlag) move.add(right);
      if (move.lengthSq() > 0) move.normalize();
      if (!this.data.fly) move.y = 0;
      move.multiplyScalar(s);
      cam.position.add(move);
    },
    remove: function () {
      window.removeEventListener('keydown', this.onKeyDown);
      window.removeEventListener('keyup', this.onKeyUp);
    }
  });

  const oceanEl = document.getElementById('ocean');
  if (kind === 'ocean') {
    titleEl.textContent = 'WAVES';
    backEl.setAttribute('href', 'shaders.html#s4');
    skyEl.setAttribute('tezz-sky', 'kind: clouds');
    oceanEl.setAttribute('visible', true);
    playerEl.setAttribute('position', '0 4.5 0');
    playerEl.setAttribute('fly-wasd', { speed: 15, fly: false });
    document.body.classList.add('ocean');
    if (scene.setAttribute) scene.setAttribute('renderer', 'resolution: 1');
  } else {
    skyEl.setAttribute('tezz-sky', 'kind: ' + kind);
    playerEl.setAttribute('position', '0 8 0');
    playerEl.setAttribute('fly-wasd', { speed: kind === 'planet' ? 28 : 20, fly: true });
    if (kind === 'planet' && scene.setAttribute) scene.setAttribute('renderer', 'resolution: ' + QUALITY.res);
    oceanEl.setAttribute('visible', false);
  }

  scene.addEventListener('loaded', function () {
    document.body.classList.remove('off');
    /* Force the player entity to be the active camera -- A-Frame should
       do this automatically, but this guarantees look + WASD drive the view. */
    playerEl.setAttribute('camera', 'active: true');
  });

  gate.addEventListener('click', function () {
    const c = scene.canvas;
    if (c && c.requestPointerLock) { try { c.requestPointerLock(); } catch (e) {} }
  });
  document.addEventListener('pointerlockchange', function () {
    document.body.classList.toggle('off', !!document.pointerLockElement);
  });

  /* Live telemetry -- proves WASD is moving the player (and makes the
     parallax visible: the POS readout should change as you walk). */
  const posEl = document.getElementById('pos');
  function posLoop() {
    const p = playerEl.object3D ? playerEl.object3D.position : null;
    if (p && posEl) {
      posEl.textContent = 'POS ' + p.x.toFixed(1) + ' / ' + p.y.toFixed(1) + ' / ' + p.z.toFixed(1)
        + (playerEl.components['fly-wasd'] ? '  fly:on' : '  fly:off');
    }
    requestAnimationFrame(posLoop);
  }
  posLoop();

  /* ---------- Debug panel: tune texture strengths live (persisted) ---------- */
  const dbg = document.getElementById('dbg');
  if (kind === 'planet' || kind === 'ocean') dbg.style.display = 'block';
  if (kind === 'planet') {
    document.querySelectorAll('.o-only').forEach(el => { el.style.display = 'none'; });
    const sc = document.getElementById('dbgScale');
    sc.min = 0.005; sc.max = 0.1; sc.step = 0.005; sc.value = 0.02;
    document.getElementById('vScale').textContent = '0.02';
  } else {
    document.querySelectorAll('.p-only').forEach(el => { el.style.display = 'none'; });
  }
  document.getElementById('dbgToggle').addEventListener('click', () => dbg.classList.toggle('open'));
  function activeMat() {
    const ocean = document.getElementById('ocean');
    if (kind === 'ocean' && ocean && ocean.components['tezz-ocean']) return ocean.components['tezz-ocean'].mesh.material;
    const sky = document.getElementById('sky');
    return sky && sky.components['tezz-sky'] ? sky.components['tezz-sky'].mesh.material : null;
  }
  /* Slider values persist per-kind so your tuned settings are the effective
     defaults on every load. */
  const DBG_KEY = kind === 'ocean' ? 'tezz-debug-water' : 'tezz-debug-planet';
  let debugVals = {};
  try { debugVals = JSON.parse(localStorage.getItem(DBG_KEY) || '{}') || {}; } catch (e) { debugVals = {}; }
  function saveDebug() { try { localStorage.setItem(DBG_KEY, JSON.stringify(debugVals)); } catch (e) {} }
  function fmtVal(v) { return String(+Number(v).toFixed(3)); }
  function bindSlider(id, valId, uniform) {
    const el = document.getElementById(id);
    if (debugVals[id] !== undefined) el.value = debugVals[id];
    const sync = () => { document.getElementById(valId).textContent = fmtVal(el.value); };
    sync();
    el.addEventListener('input', e => {
      debugVals[id] = parseFloat(e.target.value);
      saveDebug();
      sync();
      const m = activeMat();
      if (m && m.uniforms[uniform]) m.uniforms[uniform].value = debugVals[id];
    });
  }
  function applySavedDebug() {
    const m = activeMat();
    if (!m) return;
    const map = { dbgNormal: 'uNormalStr', dbgSpec: 'uSpecInt', dbgShine: 'uSpecShine', dbgFres: 'uFresnelStr', dbgFoam: 'uFoamAmt', dbgFog: 'uFogDensity', dbgScale: 'uTexScale' };
    Object.keys(map).forEach(id => {
      if (debugVals[id] !== undefined && m.uniforms[map[id]]) m.uniforms[map[id]].value = debugVals[id];
    });
  }
  /* Capture whatever the sliders are set to when leaving the page, so the
     current tuned look becomes the default next load. */
  window.addEventListener('beforeunload', () => {
    ['dbgNormal', 'dbgSpec', 'dbgShine', 'dbgFres', 'dbgFoam', 'dbgFog', 'dbgScale'].forEach(id => {
      const el = document.getElementById(id);
      if (el) debugVals[id] = parseFloat(el.value);
    });
    saveDebug();
  });
  bindSlider('dbgNormal', 'vNormal', 'uNormalStr');
  bindSlider('dbgSpec', 'vSpec', 'uSpecInt');
  bindSlider('dbgShine', 'vShine', 'uSpecShine');
  bindSlider('dbgFres', 'vFres', 'uFresnelStr');
  bindSlider('dbgFoam', 'vFoam', 'uFoamAmt');
  bindSlider('dbgFog', 'vFog', 'uFogDensity');
  bindSlider('dbgScale', 'vScale', 'uTexScale');
  document.getElementById('dbgTitle').textContent = kind === 'ocean' ? 'WATER TEXTURES' : 'PLANET TEXTURES';
  const dbgStatus = document.getElementById('dbgStatus');
  dbgStatus.textContent = 'QUALITY ' + QUALITY.label;
  setTimeout(() => {
    applySavedDebug();
    const m = activeMat();
    dbgStatus.textContent += ' · ' + ((m && m.uniforms.uHasTex && m.uniforms.uHasTex.value > 0.5) ? 'TEX: loaded' : 'TEX: procedural');
  }, 2500);
})();
</script>
